name: Uyum Kontrolü

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: MASTER_CONTEXT uyum kontrolü
        run: node scripts/check-compliance.mjs
